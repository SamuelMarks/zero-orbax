repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check (Fix)
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Pytest Coverage
        entry: env PYTHONPATH=src pytest --cov=src --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docs
        name: Check Documentation Coverage
        entry: python3 check_docs.py
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Shields
        entry: python3 scripts/update_badges.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-allowed-imports
        name: Check Disallowed 3rd Party Imports
        entry: python3 scripts/check_allowed_imports.py
        language: system
        types: [python]
        exclude: ^(tests/|scripts/)
        pass_filenames: true


      - id: check-api-compliance
        name: Check API Conformance
        entry: env PYTHONPATH=src:../ml-switcheroo-compiler/src python3 scripts/check_compliance.py
        language: system
        files: ^(SEMANTIC_PLAN\.md|src/.*\.py)$
        pass_filenames: false

      - id: build
        name: Build Package
        entry: python3 -m build
        language: system
        pass_filenames: false
