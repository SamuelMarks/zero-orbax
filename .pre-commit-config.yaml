repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-check
        name: Ruff Check
        entry: ruff check --fix .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Mypy Strict Type Check
        entry: mypy --strict src tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: lint-typing
        name: Lint Strict Typing and Reflection
        entry: python3 scripts/lint_typing.py
        language: system
        types: [python]
        pass_filenames: false

      - id: interrogate
        name: Interrogate Docstring Coverage
        entry: interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        language: system
        types: [python]
        pass_filenames: false

      - id: check-docs
        name: Check 100% Granular Docstrings
        entry: python3 scripts/check_docs.py
        language: system
        types: [python]
        pass_filenames: false

      - id: check-allowed-imports
        name: Check Allowed 3rd Party Imports
        entry: python3 scripts/check_allowed_imports.py src/zero_orbax
        language: system
        types: [python]
        pass_filenames: false

      - id: check-api-compliance
        name: Check API Compliance
        entry: python3 scripts/check_compliance.py
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: Run Tests with 100% Line and Branch Coverage
        entry: pytest --cov=src/zero_orbax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100
        language: system
        types: [python]
        pass_filenames: false

      - id: update-badges
        name: Update Coverage Badges
        entry: python3 scripts/update_badges.py
        language: system
        pass_filenames: false
