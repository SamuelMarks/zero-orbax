name: CI

on:
  push:
    branches: [ master ]


permissions:
  contents: write

env:
  UV_DYNAMIC_VERSIONING_BYPASS: "2.2.0"
  PDM_BUILD_SCM_VERSION: "2.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zero-orbax
    steps:
    - uses: actions/checkout@v7
      with:
        path: zero-orbax

    - name: Checkout zero-jax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-jax
        path: zero-jax

    - name: Checkout zero-chex
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-chex
        path: zero-chex

    - name: Checkout zero-flax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-flax
        path: zero-flax

    - name: Checkout zero-grain
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-grain
        path: zero-grain

    - name: Checkout zero-optax
      uses: actions/checkout@v7
      with:
        repository: SamuelMarks/zero-optax
        path: zero-optax

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build pre-commit
        pip install -r requirements-test.txt
        pip install "cdd @ git+https://github.com/offscale/cdd-python.git@master"
        pip install --ignore-requires-python --no-deps \
          "griffelib @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffelib" \
          "griffecli @ git+https://github.com/SamuelMarks/griffe.git@rest#subdirectory=packages/griffecli" \
          "griffe @ git+https://github.com/SamuelMarks/griffe.git@rest"
        pip install \
          "ml-switcheroo-ir @ https://github.com/SamuelMarks/ml-switcheroo-ir/releases/download/v0.0.4/ml_switcheroo_ir-0.0.4-py3-none-any.whl" \
          "ml-switcheroo-compiler @ https://github.com/SamuelMarks/ml-switcheroo-compiler/releases/download/v0.0.1/ml_switcheroo_compiler-0.0.1-py3-none-any.whl"
        pip install --no-deps \
          "ml-ecosystem-snapshots @ https://github.com/SamuelMarks/ml-ecosystem-snapshots/releases/download/v0.0.5/ml_ecosystem_snapshots-0.0.5-py3-none-any.whl"
        pip install --no-deps -e ../zero-jax
        pip install --no-deps -e ../zero-chex
        pip install --no-deps -e ../zero-flax
        pip install --no-deps -e ../zero-grain
        pip install --no-deps -e ../zero-optax
        pip install --no-deps -e .

    - name: Check Code Formatting and Linting (Ruff)
      run: |
        ruff format --check .
        ruff check .

    - name: Run Mypy Strict Type Check
      run: mypy --strict src tests scripts

    - name: Run AST Typing and Reflection Linter
      run: python3 scripts/lint_typing.py

    - name: Run Interrogate and Granular Docstring Check
      run: |
        interrogate -vv -f 100 -M -i -c pyproject.toml src scripts tests
        python3 scripts/check_docs.py

    - name: Run Allowed Imports and API Compliance Checks
      run: |
        python3 scripts/check_allowed_imports.py src/zero_orbax
        python3 scripts/check_compliance.py

    - name: Run Tests with 100% Line and Branch Coverage
      run: pytest --cov=src/zero_orbax --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100

    - name: Check Badges Up-to-date
      run: |
        python3 scripts/update_badges.py
        if ! git diff --exit-code README.md; then
          echo "Coverage badges in README.md are out of date. Please run the update badges script locally and commit the changes."
          exit 1
        fi

    - name: Build Package
      run: python -m build
